# Monthly, grouped update PRs for the pinned GitHub Actions and the web app's
# npm packages, so security fixes arrive without anyone watching for them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
